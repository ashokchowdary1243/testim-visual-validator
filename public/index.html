<!DOCTYPE html>
<html>
<head>
  <title>Visual Validator</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    h1 { color: #38bdf8; }

    input, button {
      padding: 10px;
      margin: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #22c55e;
      font-weight: bold;
      cursor: pointer;
    }

    pre {
      background: black;
      padding: 10px;
      border-radius: 8px;
      text-align: left;
    }
  </style>
</head>

<body>

  <h1>🔥 Visual Validator</h1>

  <input id="testName" placeholder="Enter test name" />
  <br/>

  <button onclick="runTest()">Run Validation</button>

  <h3>Result</h3>
  <pre id="result">Waiting...</pre>

  <script>
    async function runTest() {
      const testName = document.getElementById("testName").value || "demo";

      document.getElementById("result").innerText = "Running...";

      const res = await fetch("/api/validate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image: "dummy_base64",
          testName
        })
      });

      const data = await res.json();

      document.getElementById("result").innerText =
        JSON.stringify(data, null, 2);
    }
  </script>

</body>
</html>
